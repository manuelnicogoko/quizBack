server.port=80
server.error.include-stacktrace=never

#configuración MySQL hosting
spring.datasource.url=jdbc:mysql://<TU_HOST>:3306/<TU_DB>
spring.datasource.username=<TU_USUARIO>
spring.datasource.password=<TU_CONTRASENA>
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Inicialización de la base de datos  data.sql (cambiar cuando este definitivo)
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always 
spring.jpa.defer-datasource-initialization=true

#spring.jpa.hibernate.ddl-auto=validate
#spring.sql.init.mode=never

# Allowed origin for WebSocket (production)
app.websocket.allowed-origin=https://cryptum.vercel.app/

app.frontend.url=https://cryptum.vercel.app/